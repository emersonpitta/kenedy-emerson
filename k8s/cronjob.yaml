apiVersion: batch/v1
kind: CronJob
metadata:
  name: verificar-saude
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: checar
              image: curlimages/curl:8.12.1
              args:
                - "-fsS"
                - "--max-time"
                - "3"
                - "http://spam-service/health"
